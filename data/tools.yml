featured:
  - title: "Crash Causal Explorer Lab"
    url: "https://pozapas.github.io/mental-explorer-lab/"
    image: "/images/tools/mental-explorer-lab.webp"
    alt: "Crash Causal Explorer Lab dataset selection screen"
    type: "Causal analysis lab"
    description: "Supports causal review of deidentified pedestrian and e-scooter crash narratives."
  - title: "Pedestrian Fatal Crash News Observatory"
    url: "https://pedestrian-fatal-dashboard.vercel.app/"
    image: "/images/tools/pedestrian-fatal-dashboard.webp"
    alt: "Pedestrian Fatal Crash News Observatory dashboard with national crash totals"
    type: "Research dashboard"
    description: "Tracks news-detected pedestrian fatal crashes and supports review of events, sources, and patterns."
  - title: "PEDAT"
    url: "https://pedpush.dev.udot.utah.gov/"
    image: "/images/tools/pedat.webp"
    alt: "PEDAT dashboard with a Utah map and pedestrian signal locations"
    type: "UDOT pedestrian data platform"
    description: "Estimates and maps pedestrian volumes from signal push-button data. UDOT integrated this work into ATSPM 5.2 as Pedestrian Activity."
    secondary_label: "UDOT ATSPM"
    secondary_url: "https://udottraffic.utah.gov/atspm/"
  - title: "CLB Finder"
    url: "https://clb-finder.vercel.app/"
    image: "/images/tools/clb-finder.webp"
    alt: "CLB Finder map of Texas center line buffer sites and screening results"
    type: "NCHRP 17-134 screening demo"
    description: "Screens rural Texas roads for painted center line buffers with roadway data, Street View coverage, and vision models."
  - title: "FARS 2024"
    url: "https://pozapas.github.io/fars2024/"
    image: "/images/tools/fars-2024.webp"
    alt: "FARS 2024 dashboard with a national crash map and linked charts"
    type: "Spatial safety dashboard"
    description: "Links a movable map lens to national fatal-crash summaries and detailed safety charts."
  - title: "CoCorridor-AI"
    url: "https://pozapas.github.io/cocorridor-demo/"
    image: "/images/tools/co-corridor.webp"
    alt: "CoCorridor-AI connected corridor digital twin dashboard"
    type: "Connected corridor digital twin"
    description: "Demonstrates coordinated corridor operations, edge nodes, telemetry, and cloud data flow."
  - title: "Agentic AI in Civil Engineering"
    url: "/aicivil.html"
    image: "/images/tools/agentic-civil.webp"
    alt: "Agentic AI in Civil Engineering interactive learning page"
    type: "Interactive learning resource"
    description: "Explains AI agents, tools, skills, and civil-engineering applications through an interactive guide."
  - title: "pAIper"
    url: "https://paiper.streamlit.app/"
    image: "/images/tools/paiper.webp"
    alt: "pAIper manuscript review console"
    type: "AI manuscript review console"
    description: "Checks venue fit, citation integrity, claim risk, method gaps, and revision priorities."
  - title: "Transit Safety Collaboration Observatory"
    url: "https://trcrp-a56.vercel.app/"
    image: "/images/tools/trcrp-a56.webp"
    alt: "Transit Safety Collaboration Observatory with evidence and agency metrics"
    type: "TCRP A-56 research demo"
    description: "Organizes transit-safety evidence, agencies, models, and policy work in one research interface."
  - title: "Age-Friendly Transit Atlas"
    url: "https://tcrp-b58.vercel.app/"
    image: "/images/tools/tcrp-b58.webp"
    alt: "Age-Friendly Transit Atlas with pilot region metrics"
    type: "TCRP B-58 research demo"
    description: "Explores how aging, transit access, and disability vary across pilot regions."
  - title: "BTS-39 Last Leg Toolkit"
    url: "https://bts-39-demo-v01.vercel.app/"
    image: "/images/tools/bts-39.webp"
    alt: "BTS-39 toolkit introduction for the last-leg impaired-driving challenge"
    type: "BTSCRP safety toolkit"
    description: "Combines crash evidence, traveler surveys, countermeasures, and an action-plan builder for last-leg impaired driving."
  - title: "CrashSketch AV"
    url: "https://crashsketch-av.vercel.app/"
    image: "/images/tools/crashsketch-av.webp"
    alt: "CrashSketch AV research preview for automated-vehicle collision diagrams"
    type: "Neuro-symbolic crash tool"
    description: "Turns an automated-vehicle crash narrative into an auditable reported-scene collision diagram."
  - title: "EvacuAIDi"
    url: "https://evacuaidi.vercel.app/"
    image: "/images/tools/evacuaidi.webp"
    alt: "EvacuAIDi research site for disability-inclusive evacuation guidance"
    type: "Evacuation decision support"
    description: "Uses causal reasoning and simulation to study probabilistic, disability-inclusive evacuation guidance."

